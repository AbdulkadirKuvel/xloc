name: C++ CI/CD Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*' # Works with only "v1.0.0" format tags.

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build_path: bin/linux/xloc
            release_exe: xloc-linux
            asset_name: xloc-linux-amd64.tar.gz
          - os: windows-latest
            build_path: bin/windows/xloc.exe
            release_exe: xloc-windows.exe
            asset_name: xloc-windows-amd64.zip

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup GCC (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt update
        sudo apt install -y g++-14 make
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

    - name: Build Project
      run: |
        make release

    - name: Package Release (Linux)
      if: runner.os == 'Linux'
      run: |
        cp ${{ matrix.build_path }} ${{ matrix.release_exe }}
        tar -czvf ${{ matrix.asset_name }} ${{ matrix.release_exe }} config.json readme.md LICENSE

    - name: Package Release (Windows)
      if: runner.os == 'Windows'
      run: |
        Copy-Item -Path ${{ matrix.build_path }} -Destination ${{ matrix.release_exe }}
        Compress-Archive -Path ${{ matrix.release_exe }}, config.json, readme.md, LICENSE -DestinationPath ${{ matrix.asset_name }}

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.asset_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}